name: Latest Medium posts

# Fills the list between the BLOG-POST-LIST markers in README.md.

on:
  schedule:
    - cron: "40 23 * * 0" # Monday 06:40 WIB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: python scripts/blog.py

      - name: Commit when the list changed
        run: |
          git diff --quiet README.md && exit 0
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update latest Medium posts" README.md
          git push -q
